{% extends 'base.html' %}

{% block title %}Update Product{% endblock %}

{% block content %}
<section class="form-container">
    <p class="eyebrow form-heading">Edit Product</p>
    <h1 class="form-title">Update {{ product.name }}</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Vintage Leather Jacket"
                value="{{ product.name }}" required>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-control" required>
                {% for category in categories %}
                    {% if category.id == selected_category_id %}
                        <option value='{{ category.id }}' selected>{{ category.name }}</option>
                    {% else %}
                        <option value='{{ category.id }}'>{{ category.name }}</option>
                    {% endif %}

                {% endfor %}
            </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="stock">Stock</label>
                <input type="number" id="stock" name="stock" class="form-control" placeholder="0"
                    value="{{ product.stock }}" required>
            </div>
            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" step="0.01" id="price" name="price" class="form-control" placeholder="0.00"
                    value="{{ product.price }}" required>
            </div>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control"
                placeholder="Describe your product in detail..."
                required>{{ product.description }}</textarea>
        </div>
        <div class="form-group">
            <label for="image">Image</label>
            <input type="file" id="image" name="image" class="form-control file-input">
            {% if product and product.image %}
            <small>Current image: <a href="{{ product.image_url }}" target="_blank">{{ product.image.name }}</a>. Leave
                blank to keep current.</small>
            {% endif %}
        </div>
        <div class="form-actions">
            <button class="btn" type="submit">Update product</button>
            <a class="btn btn-secondary" href="{% url 'products:detail' product.id %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
