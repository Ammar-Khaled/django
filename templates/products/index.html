{% extends 'base.html' %}
{% load static %}

{% block title %}Products{% endblock %}

{% block content %}
<section class="cards-grid">
    {% for product in products %}
    <article class="product-card">
        <img src="{{ product.image_url }}" alt="{{ product.name }}">
        <h2>{{ product.name|title }}</h2>
        <p class="price">${{ product.price }}</p>
        <div style="display: flex; gap: 10px; margin-top: auto;">
            <a class="btn" href="{% url 'products:detail' product.id %}">Show</a>
            <a class="btn" href="{% url 'products:update' product.id %}"
                style="background-color: #ffc107; color: #000; border-color: #ffc107;">Edit</a>
            <form action="{% url 'products:delete' product.id %}" method="post" style="margin: 0;">
                {% csrf_token %}
                <button type="submit" class="btn"
                    style="background-color: #dc3545; color: white; border-color: #dc3545;">Delete</button>
            </form>
        </div>
    </article>
    {% endfor %}
</section>
{% endblock %}
